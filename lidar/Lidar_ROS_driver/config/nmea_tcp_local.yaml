nmea_tcp:
  ros__parameters:
    address: "127.0.0.1"                    # Localhost — serial bridge
    port: 62002                              # Serial bridge TCP port
    nmea_topic: nmea_sentence               # Publish NMEA topic name
    frame_id: sentence                       # NMEA topic frame_id
    rate: 0.0                                # 0 = no rate limit (stream all)
